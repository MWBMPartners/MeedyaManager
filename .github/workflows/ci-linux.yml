name: Linux GTK4 CI

on:
  # Direct pushes to main, alpha or beta still trigger native runs.
  push:
    branches: [main, alpha, beta]
    paths:
      - "crates/mm-gtk/**"
  # PRs reach this workflow via pr-gate.yml (the umbrella). Do NOT add a
  # pull_request: trigger here or runs will duplicate.
  workflow_call:

jobs:
  linux-gtk4-ci:
    name: Linux GTK4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GTK4, Libadwaita and gettext system dependencies
        run: |
          sudo apt-get update
          # libgtk-4-dev + libadwaita-1-dev: GTK4 UI bindings
          # gettext: required by the gettextrs crate for GNU gettext i18n support
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev gettext

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check mm-gtk formatting
        # mm-gtk is excluded from the workspace, so `cargo fmt --all` in
        # ci-rust.yml never reaches it.  Until this step existed the crate had
        # drifted to 136 unformatted sites, in files nobody had edited for
        # months, because nothing anywhere checked it.  Formatting is the one
        # gate that can run before the crate compiles, so it goes first.
        #
        # NOTE: clippy is deliberately NOT run here yet.  The crate cannot be
        # compiled on a non-Linux developer machine (GTK4 + gettextrs system
        # libraries), so a lint gate would be unverifiable locally and would
        # most likely land red.  Add it once this job is reliably green.
        run: cargo fmt --manifest-path crates/mm-gtk/Cargo.toml --check

      - name: Build mm-gtk crate
        # mm-gtk is excluded from the workspace (gettextrs needs Linux system libs).
        # Build it via its own manifest path.
        run: cargo build --manifest-path crates/mm-gtk/Cargo.toml

      - name: Run mm-gtk tests under Xvfb
        run: xvfb-run cargo test --manifest-path crates/mm-gtk/Cargo.toml
