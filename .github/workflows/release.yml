# (C) 2025-2026 MWBM Partners Ltd
# MeedyaManager — Release Build
#
# Triggered by pushing a tag matching v* (e.g. v1.4.0-alpha.1), or manually via
# workflow_dispatch for a dry run that builds every platform without publishing.
#
# Build-failure policy (issue #202):
#   * Copy / archive / checksum commands are NOT suppressed. This workflow had
#     never run, and every copy was wrapped in `2>/dev/null || true`, so seven
#     copies of binaries that do not exist failed silently and the tar.gz that
#     was attached to the release contained only LICENSE. A packaging step that
#     cannot find its input must fail the job, loudly.
#   * The two Windows jobs are `continue-on-error: true` — Windows CI has never
#     been green (issue #148) and must not block a macOS/Linux alpha.
#   * `create-release` therefore uses `if: always()` with explicit result checks
#     for macOS and the two Linux jobs only.
#
# Binary names (do not "correct" these back):
#   * CLI  = `meedya`      (crates/mm-cli/Cargo.toml `[[bin]] name`), `meedya.exe` on Windows
#   * GTK  = `meedya-gtk`  (crates/mm-gtk/Cargo.toml `[[bin]] name`)
#   `mm-cli` / `mm-gtk` are *crate* names and are not produced as files.

name: Release Build

on:
  push:
    tags:
      - "v*"
  # Manual trigger — the only way to exercise this pipeline without cutting a
  # tag. With `publish` left unticked the platform jobs run and upload their
  # artefacts, but no GitHub Release is created.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (semver, no leading 'v'). Leave blank to use [workspace.package].version from Cargo.toml."
        required: false
        type: string
        default: ""
      publish:
        description: "Create the draft GitHub Release. Leave unticked for a build-only dry run."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Prepare — resolve the version (tag or dispatch input), validate, set prefix
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      artifact_prefix: ${{ steps.meta.outputs.artifact_prefix }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        env:
          # Read through the environment rather than spliced into the script
          # body, so an odd input (quotes, spaces) cannot break the script.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            # Tag push — strip the leading 'v' to get the semver string.
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            SOURCE="tag ${TAG}"
          elif [ -n "${INPUT_VERSION}" ]; then
            # Manual run with an explicit version.
            VERSION="${INPUT_VERSION}"
            SOURCE="workflow_dispatch input"
          else
            # Manual run with a blank version — read the workspace version.
            # (GitHub Actions cannot express a file-derived default, so the
            #  input defaults to "" and the fallback happens here.)
            VERSION=$(awk -F'"' '
              /^\[workspace\.package\]/ { in_table = 1; next }
              in_table && /^\[/           { exit }
              in_table && /^version[[:space:]]*=/ { print $2; exit }
            ' Cargo.toml)
            SOURCE="Cargo.toml [workspace.package].version"
          fi

          if [ -z "${VERSION}" ]; then
            echo "::error::Could not determine a version to build"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "artifact_prefix=MeedyaManager-${VERSION}" >> "$GITHUB_OUTPUT"

          # A semver pre-release carries a hyphen (1.4.0-alpha.1).
          if echo "${VERSION}" | grep -q -- '-'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            PRERELEASE="yes"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            PRERELEASE="no"
          fi

          {
            echo "## Release: v${VERSION}"
            echo ""
            echo "- Version source: ${SOURCE}"
            echo "- Pre-release: ${PRERELEASE}"
            echo "- Publish a GitHub Release: ${{ github.event_name == 'push' || inputs.publish }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify version matches Cargo.toml
        run: |
          set -euo pipefail
          CARGO_VER=$(awk -F'"' '
            /^\[workspace\.package\]/ { in_table = 1; next }
            in_table && /^\[/           { exit }
            in_table && /^version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)
          BUILD_VER="${{ steps.meta.outputs.version }}"

          if [ "${CARGO_VER}" = "${BUILD_VER}" ]; then
            echo "Version matches Cargo.toml: ${CARGO_VER}"
            exit 0
          fi

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            # A tag that disagrees with Cargo.toml would ship binaries stamped
            # with the wrong version — hard failure.
            echo "::error::Tag version (${BUILD_VER}) does not match Cargo.toml (${CARGO_VER})"
            echo "Run the version-bump workflow first: gh workflow run version-bump.yml -f version=${BUILD_VER}"
            exit 1
          fi

          # Manual dry runs are allowed to disagree — warn only, so the pipeline
          # can be exercised without touching Cargo.toml.
          echo "::warning::Requested version (${BUILD_VER}) does not match Cargo.toml (${CARGO_VER}) — binaries will report ${CARGO_VER}"

      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"

          # docs/changelog.md headings look like:
          #   ## [v1.3.0] — 2026-03-06 — Test Mode, Privacy Policy, …
          # Match the literal "## [v<version>]" prefix (awk `index(...) == 1`,
          # so no regex metacharacter escaping is needed for the dots) and print
          # until the next "## [" heading.
          NOTES=$(awk -v hdr="## [v${VERSION}]" '
            index($0, hdr) == 1 { inside = 1; next }
            inside && /^## \[/  { exit }
            inside              { print }
          ' docs/changelog.md)

          if [ -z "${NOTES}" ]; then
            NOTES="No changelog entry found for v${VERSION}. See [docs/changelog.md](docs/changelog.md) for details."
            echo "::warning::No '## [v${VERSION}]' heading in docs/changelog.md — release notes will be a placeholder"
          fi

          printf '%s\n' "${NOTES}" > /tmp/release-notes.md
          echo "Release notes extracted for v${VERSION}"

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: /tmp/release-notes.md
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS — Apple Silicon (arm64)
  # ---------------------------------------------------------------------------
  release-macos:
    name: macOS arm64
    # macos-26: Package.swift declares swift-tools-version 6.3, which needs
    # Xcode 26.3+ (Swift 6.3). The macOS 15 image's default Xcode 16.4 is only
    # Swift 6.1 — too old, which is why this job no longer uses it. Kept in
    # step with ci-macos.yml; change both together.
    runs-on: macos-26
    needs: prepare

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # Builds every workspace member, including the `meedya` CLI binary and
      # the mm-ffi cdylib. mm-gtk is excluded from the workspace and is not
      # built on macOS at all (it is Linux-only).
      - name: Build Rust workspace (release)
        run: cargo build --release --workspace

      # Explicit, even though mm-ffi is a workspace member: it documents the
      # dependency of the Swift app on libmm_ffi.dylib and is a cache hit.
      - name: Build mm-ffi dynamic library
        run: cargo build -p mm-ffi --release

      - name: Build SwiftUI app
        working-directory: macos
        run: swift build -c release

      # Issue #66 is not done yet: the SwiftUI app currently builds and runs,
      # but does not link against the Rust engine, so it would show no real
      # data if shipped. Detect that here instead of assuming it, so the day
      # #66 lands and the define is uncommented, the app starts being
      # attached automatically with no further change to this workflow.
      #
      # Two independent checks, both must hold before we call it "linked":
      #   - DEFINE_ON: has Package.swift been told to compile in the FFI code
      #     path at all (the .define("MM_FFI_AVAILABLE") line uncommented)?
      #   - SYMBOLS_ON: did the resulting binary actually pull in the Rust
      #     symbols? `nm` (not `otool -L`) is used because it lists symbols
      #     from the binary's own text/data, so it finds them whether
      #     libmm_ffi was linked statically or dynamically.
      - name: Check whether the app links the Rust engine
        id: link
        working-directory: macos
        run: |
          set -uo pipefail

          if grep -Eq '^\s*\.define\("MM_FFI_AVAILABLE"' Package.swift; then
            DEFINE_ON=true
          else
            DEFINE_ON=false
          fi

          # Written to a file first rather than piped straight into
          # `grep -q`. Under `set -o pipefail` (above), `grep -q` exits the
          # instant it finds its first match — which closes its end of the
          # pipe while `nm` is often still writing, `nm` is then killed with
          # a broken-pipe error, and `pipefail` reports that non-zero exit as
          # the whole pipeline's result. That turns a real "yes, linked" into
          # a false "no". Reproduced: on a binary containing the symbol 15
          # times, the piped form said "not linked" 5 times out of 5;
          # searching a file containing the same `nm` output said "linked" 5
          # times out of 5. Do not "simplify" this back into a pipe.
          #
          # `|| true` on the `nm` line: a missing binary (build failed
          # earlier, or this step run out of context) must still leave
          # SYMBOLS_ON=false rather than failing the step outright — the
          # warning below already says plainly that the app isn't linked.
          NM_OUTPUT="${RUNNER_TEMP}/mm-ffi-nm-output.txt"
          nm .build/release/MeedyaManager > "${NM_OUTPUT}" 2>/dev/null || true
          if grep -q uniffi_mm_ffi_fn_func_execute_renames "${NM_OUTPUT}" 2>/dev/null; then
            SYMBOLS_ON=true
          else
            SYMBOLS_ON=false
          fi

          if [ "$DEFINE_ON" = true ] && [ "$SYMBOLS_ON" = true ]; then
            echo "linked=true" >> "$GITHUB_OUTPUT"
          else
            echo "linked=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=macOS app not published::The SwiftUI app does not link the Rust engine (define=$DEFINE_ON, symbols=$SYMBOLS_ON). Only the command-line tool is shipped for macOS until issue #66 is done — see #222."
          fi

      # No Apple signing secrets are configured, so create-dmg.sh emits a
      # warning and falls through to an unsigned, un-notarised hdiutil DMG.
      # That path uses only tools present on every macOS runner, so the script
      # is invoked strictly — a genuine failure must fail the job.
      #
      # Only run this at all when the app actually links the engine (#222
      # item 4) — otherwise we would be packaging and shipping an app that
      # shows no real data, which misleads users into thinking macOS has a
      # working GUI already.
      - name: Package macOS DMG
        if: steps.link.outputs.linked == 'true'
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_TEAM_ID:      ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID:           ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash macos/packaging/create-dmg.sh "${{ needs.prepare.outputs.version }}"

      - name: Package macOS artifacts
        run: |
          set -euo pipefail
          PREFIX="${{ needs.prepare.outputs.artifact_prefix }}"
          mkdir -p staging

          # Rust outputs. `meedya` is the CLI binary name (crate mm-cli).
          # These are the real macOS deliverable of this alpha and are always
          # staged, regardless of whether the SwiftUI app links the engine.
          cp target/release/libmm_ffi.dylib staging/
          cp target/release/meedya staging/

          # Swift build output — the SwiftUI executable. Only worth shipping
          # once it actually links the Rust engine (#222 item 4); before that
          # it is a shell with no real data and would only mislead users.
          if [ "${{ steps.link.outputs.linked }}" = "true" ]; then
            cp macos/.build/release/MeedyaManager staging/
          fi

          # GPL-2.0-or-later requires the licence to accompany every binary (#207).
          cp LICENSE staging/

          # COPYFILE_DISABLE stops BSD tar writing AppleDouble "._" companions
          # for the extended attributes macOS puts on freshly built binaries.
          if [ "${{ steps.link.outputs.linked }}" = "true" ]; then
            COPYFILE_DISABLE=1 tar -czf "${PREFIX}-macos-arm64.tar.gz" \
              -C staging MeedyaManager meedya libmm_ffi.dylib LICENSE
          else
            COPYFILE_DISABLE=1 tar -czf "${PREFIX}-macos-arm64.tar.gz" \
              -C staging meedya libmm_ffi.dylib LICENSE
          fi

          # One checksum file per platform, covering the artefacts we upload.
          # The .dmg only exists when the app links the engine — checksum it
          # only then, or shasum fails on a file that was never created.
          if [ "${{ steps.link.outputs.linked }}" = "true" ]; then
            shasum -a 256 \
              "${PREFIX}-macos-arm64.tar.gz" \
              "${PREFIX}-macos-arm64.dmg" \
              > "${PREFIX}-macos-arm64.sha256"
          else
            shasum -a 256 \
              "${PREFIX}-macos-arm64.tar.gz" \
              > "${PREFIX}-macos-arm64.sha256"
          fi

          echo "Staged for macOS arm64:"
          ls -l staging
          cat "${PREFIX}-macos-arm64.sha256"

      - name: Upload macOS CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            ${{ needs.prepare.outputs.artifact_prefix }}-macos-arm64.tar.gz
            ${{ needs.prepare.outputs.artifact_prefix }}-macos-arm64.sha256
          if-no-files-found: error

      # Separate from the archive upload above: the .dmg only exists when the
      # app links the Rust engine, so its upload step is gated the same way.
      - name: Upload macOS app DMG
        if: steps.link.outputs.linked == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: ${{ needs.prepare.outputs.artifact_prefix }}-macos-arm64.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows — x64
  #
  # continue-on-error: the Windows build has never been green (issue #148).
  # It stays in the matrix so regressions remain visible, but it must not
  # block a macOS/Linux alpha.
  # ---------------------------------------------------------------------------
  release-windows-x64:
    name: Windows x64
    runs-on: windows-latest
    needs: prepare
    continue-on-error: true
    # Expose signing secret as env var so it can be checked in `if:` conditions
    # (the `secrets` context is not available directly in `if:` expressions)
    env:
      WINDOWS_CERT_PFX:      ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Rust workspace (release)
        run: cargo build --release --workspace

      - name: Build mm-ffi DLL
        run: cargo build -p mm-ffi --release

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build WinUI 3 app (x64)
        working-directory: windows
        run: dotnet publish -c Release -r win-x64 --self-contained

      # Windows Authenticode signing via signtool.exe.
      # Requires WINDOWS_CERT_PFX (Base64-encoded PFX) and
      # WINDOWS_CERT_PASSWORD in GitHub repository secrets.
      # See Dev_Notes.md — "GitHub Secrets Configuration" for setup.
      - name: Code sign Windows binaries (x64)
        if: env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        run: |
          # Decode the Base64-encoded PFX file from the secret
          $pfxBytes = [Convert]::FromBase64String($env:WINDOWS_CERT_PFX)
          $pfxPath  = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

          # Sign all Windows executables and DLLs in the publish output
          $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe"
          $targets  = Get-ChildItem -Recurse -Include "*.exe","*.dll" `
                        -Path "windows/MeedyaManager/bin/Release","target/release" `
                        -ErrorAction SilentlyContinue

          foreach ($target in $targets) {
            & $signtool sign `
              /fd SHA256 `
              /td SHA256 `
              /tr "http://timestamp.digicert.com" `
              /f $pfxPath `
              /p $env:WINDOWS_CERT_PASSWORD `
              $target.FullName
            Write-Output "Signed: $($target.Name)"
          }

          # Clean up PFX from temp dir
          Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          Write-Output "Code signing complete"

      - name: Code sign Windows binaries (x64, skipped)
        if: env.WINDOWS_CERT_PFX == ''
        run: echo "::warning::WINDOWS_CERT_PFX not set — code signing skipped (see Dev_Notes.md)"

      - name: Package Windows x64 artifacts
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="${{ needs.prepare.outputs.artifact_prefix }}"
          mkdir -p staging

          # Rust outputs. `meedya.exe` is the CLI binary name (crate mm-cli).
          cp target/release/mm_ffi.dll staging/
          cp target/release/meedya.exe staging/

          # .NET publish output (TFM is net8.0-windows10.0.22621.0).
          cp -r windows/MeedyaManager/bin/Release/net8.0-windows*/win-x64/publish/* staging/

          # GPL-2.0-or-later requires the licence to accompany every binary (#207).
          cp LICENSE staging/

          # The publish output contains subdirectories (runtimes/, Assets/…),
          # so checksum every regular file rather than globbing the top level.
          # Written outside staging/ so it cannot list itself.
          ( cd staging && find . -type f -print0 | sort -z \
              | xargs -0 sha256sum ) > "${PREFIX}-windows-x64.sha256"

          echo "Staged for Windows x64:"
          ls -l staging

      # upload-artifact will not preserve a bare directory usefully, and the
      # previous version uploaded `staging/` unarchived. Zip it first.
      - name: Archive Windows x64 staging directory
        shell: pwsh
        run: |
          $prefix = "${{ needs.prepare.outputs.artifact_prefix }}"
          Compress-Archive -Path "staging/*" -DestinationPath "${prefix}-windows-x64.zip" -Force
          $hash = (Get-FileHash "${prefix}-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          Add-Content -Path "${prefix}-windows-x64.sha256" -Value "$hash  ${prefix}-windows-x64.zip"
          Write-Output "Created ${prefix}-windows-x64.zip"

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            ${{ needs.prepare.outputs.artifact_prefix }}-windows-x64.zip
            ${{ needs.prepare.outputs.artifact_prefix }}-windows-x64.sha256
          # `warn`, not `error`: this job is allowed to fail (#148) and an
          # upload failure here would only add noise.
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Windows — arm64  (continue-on-error, see the x64 job comment)
  # ---------------------------------------------------------------------------
  release-windows-arm64:
    name: Windows arm64
    runs-on: windows-latest
    needs: prepare
    continue-on-error: true
    env:
      WINDOWS_CERT_PFX:      ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Rust workspace (release, arm64)
        run: cargo build --release --workspace --target aarch64-pc-windows-msvc

      - name: Build mm-ffi DLL (arm64)
        run: cargo build -p mm-ffi --release --target aarch64-pc-windows-msvc

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build WinUI 3 app (arm64)
        working-directory: windows
        run: dotnet publish -c Release -r win-arm64 --self-contained

      - name: Code sign Windows binaries (arm64)
        if: env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        run: |
          $pfxBytes = [Convert]::FromBase64String($env:WINDOWS_CERT_PFX)
          $pfxPath  = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe"
          $targets  = Get-ChildItem -Recurse -Include "*.exe","*.dll" `
                        -Path "windows/MeedyaManager/bin/Release","target/aarch64-pc-windows-msvc/release" `
                        -ErrorAction SilentlyContinue
          foreach ($target in $targets) {
            & $signtool sign /fd SHA256 /td SHA256 `
              /tr "http://timestamp.digicert.com" `
              /f $pfxPath /p $env:WINDOWS_CERT_PASSWORD $target.FullName
          }
          Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue

      - name: Code sign Windows binaries (arm64, skipped)
        if: env.WINDOWS_CERT_PFX == ''
        run: echo "::warning::WINDOWS_CERT_PFX not set — code signing skipped (see Dev_Notes.md)"

      - name: Package Windows arm64 artifacts
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="${{ needs.prepare.outputs.artifact_prefix }}"
          mkdir -p staging
          TARGET=target/aarch64-pc-windows-msvc/release

          # Rust outputs. `meedya.exe` is the CLI binary name (crate mm-cli).
          cp "${TARGET}/mm_ffi.dll" staging/
          cp "${TARGET}/meedya.exe" staging/

          # .NET publish output (TFM is net8.0-windows10.0.22621.0).
          cp -r windows/MeedyaManager/bin/Release/net8.0-windows*/win-arm64/publish/* staging/

          # GPL-2.0-or-later requires the licence to accompany every binary (#207).
          cp LICENSE staging/

          ( cd staging && find . -type f -print0 | sort -z \
              | xargs -0 sha256sum ) > "${PREFIX}-windows-arm64.sha256"

          echo "Staged for Windows arm64:"
          ls -l staging

      - name: Archive Windows arm64 staging directory
        shell: pwsh
        run: |
          $prefix = "${{ needs.prepare.outputs.artifact_prefix }}"
          Compress-Archive -Path "staging/*" -DestinationPath "${prefix}-windows-arm64.zip" -Force
          $hash = (Get-FileHash "${prefix}-windows-arm64.zip" -Algorithm SHA256).Hash.ToLower()
          Add-Content -Path "${prefix}-windows-arm64.sha256" -Value "$hash  ${prefix}-windows-arm64.zip"
          Write-Output "Created ${prefix}-windows-arm64.zip"

      - name: Upload Windows arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: |
            ${{ needs.prepare.outputs.artifact_prefix }}-windows-arm64.zip
            ${{ needs.prepare.outputs.artifact_prefix }}-windows-arm64.sha256
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Linux — x64
  # ---------------------------------------------------------------------------
  release-linux-x64:
    name: Linux x64
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GTK4, Libadwaita and gettext system dependencies
        run: |
          sudo apt-get update
          # gettext is required by the gettextrs crate for GNU gettext i18n support
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev gettext

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Rust workspace (release)
        run: cargo build --release --workspace

      # mm-gtk is `exclude`d from the workspace (gettextrs needs Linux system
      # libs that break macOS/Windows CI), so `--workspace` never builds it.
      # `--target-dir target` is required: without it the binary lands in
      # crates/mm-gtk/target/release/ and the packaging step below misses it.
      - name: Build GTK4 frontend (release)
        run: cargo build --release --manifest-path crates/mm-gtk/Cargo.toml --target-dir target

      # dpkg-deb ships with ubuntu-latest, so this is invoked strictly.
      # Emits meedyamanager_<debian-version>_amd64.deb at the repo root.
      - name: Build .deb package
        run: bash linux/deb/build-deb.sh "${{ needs.prepare.outputs.version }}"

      # ---------------------------------------------------------------------
      # AppImage is deliberately NOT built for this release line.
      #
      # linux/appimage/build-appimage.sh assembles an AppDir but does not
      # bundle GTK4/libadwaita and their transitive dependencies, so the
      # resulting file is not self-contained and fails on any host whose GTK
      # is older than the builder's. A broken AppImage costs more tester
      # goodwill than no AppImage, so the step is omitted and the release body
      # says so explicitly. Re-enable by restoring:
      #
      #   - name: Build AppImage
      #     run: bash linux/appimage/build-appimage.sh "${{ needs.prepare.outputs.version }}"
      #
      # once the script performs a real ldd walk (or uses linuxdeploy).
      # ---------------------------------------------------------------------

      - name: Package Linux x64 artifacts
        run: |
          set -euo pipefail
          PREFIX="${{ needs.prepare.outputs.artifact_prefix }}"
          mkdir -p staging

          # `meedya-gtk` (crate mm-gtk) and `meedya` (crate mm-cli) are the
          # real binary names — there is no file called mm-gtk or mm-cli.
          cp target/release/meedya-gtk staging/
          cp target/release/meedya staging/
          cp target/release/libmm_ffi.so staging/

          # GPL-2.0-or-later requires the licence to accompany every binary (#207).
          cp LICENSE staging/

          tar -czf "${PREFIX}-linux-x64.tar.gz" \
            -C staging meedya-gtk meedya libmm_ffi.so LICENSE

          # Globbed rather than reconstructed: build-deb.sh maps a semver
          # pre-release hyphen to a Debian tilde (1.4.0-alpha.1 →
          # 1.4.0~alpha.1), so the filename is not simply "${VERSION}".
          DEB=$(ls meedyamanager_*_amd64.deb)
          sha256sum "${PREFIX}-linux-x64.tar.gz" "${DEB}" > "${PREFIX}-linux-x64.sha256"

          echo "Staged for Linux x64:"
          ls -l staging
          cat "${PREFIX}-linux-x64.sha256"

      - name: Upload Linux x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            ${{ needs.prepare.outputs.artifact_prefix }}-linux-x64.tar.gz
            ${{ needs.prepare.outputs.artifact_prefix }}-linux-x64.sha256
            meedyamanager_*_amd64.deb
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux — arm64 (cross-compilation)
  # ---------------------------------------------------------------------------
  release-linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # Note: Full cross-compilation for GTK4 arm64 requires a sysroot with
      # arm64 GTK4/Libadwaita libraries. For now, only core + CLI + FFI are
      # built — this platform ships no desktop GUI.
      - name: Build Rust core and CLI (release, arm64)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release -p mm-core -p mm-cli -p mm-ffi \
            --target aarch64-unknown-linux-gnu

      - name: Package Linux arm64 artifacts
        run: |
          set -euo pipefail
          PREFIX="${{ needs.prepare.outputs.artifact_prefix }}"
          mkdir -p staging
          TARGET=target/aarch64-unknown-linux-gnu/release

          # `meedya` is the CLI binary name (crate mm-cli).
          cp "${TARGET}/meedya" staging/
          cp "${TARGET}/libmm_ffi.so" staging/

          # GPL-2.0-or-later requires the licence to accompany every binary (#207).
          cp LICENSE staging/

          # Explicit member list, so the archive can never pick up a stray
          # checksum file written into staging/ by an earlier step.
          tar -czf "${PREFIX}-linux-arm64.tar.gz" \
            -C staging meedya libmm_ffi.so LICENSE

          sha256sum "${PREFIX}-linux-arm64.tar.gz" > "${PREFIX}-linux-arm64.sha256"

          echo "Staged for Linux arm64:"
          ls -l staging
          cat "${PREFIX}-linux-arm64.sha256"

      - name: Upload Linux arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            ${{ needs.prepare.outputs.artifact_prefix }}-linux-arm64.tar.gz
            ${{ needs.prepare.outputs.artifact_prefix }}-linux-arm64.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Create GitHub Release
  #
  # Runs on a tag push, or on a manual run with `publish` ticked. `if: always()`
  # plus explicit result checks means the two continue-on-error Windows jobs
  # cannot block the release, while a genuine macOS or Linux failure still does.
  # ---------------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: >-
      always()
      && (github.event_name == 'push' || inputs.publish)
      && needs.prepare.result == 'success'
      && needs.release-macos.result == 'success'
      && needs.release-linux-x64.result == 'success'
      && needs.release-linux-arm64.result == 'success'
    needs:
      - prepare
      - release-macos
      - release-windows-x64
      - release-windows-arm64
      - release-linux-x64
      - release-linux-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List downloaded artifacts
        run: find release-artifacts -type f | sort

      - name: Consolidate checksums
        run: |
          set -euo pipefail
          PREFIX="${{ needs.prepare.outputs.artifact_prefix }}"
          # Merge all per-platform checksum files into one
          find release-artifacts -name "*.sha256" -exec cat {} \; | sort > "${PREFIX}-SHA256SUMS.txt"
          echo "Consolidated checksums:"
          cat "${PREFIX}-SHA256SUMS.txt"

      - name: Assemble release body
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"

          # Report what actually arrived rather than the Windows jobs' `result`:
          # a job marked `continue-on-error: true` is reported as `success` in
          # the needs context even when its steps failed, so the presence of the
          # archives is the only trustworthy signal.
          if compgen -G 'release-artifacts/windows-*/*.zip' > /dev/null; then
            WIN_STATUS="Windows archives **are** attached to this release."
          else
            WIN_STATUS="**No Windows archives are attached** — the Windows jobs did not produce one."
          fi

          # Mirrors WIN_STATUS above: the macOS app .dmg is only produced when
          # the SwiftUI app actually links the Rust engine (issue #66, #222
          # item 4). Check for the file itself rather than trusting a job
          # result, for the same reason as the Windows check.
          #
          # The whole bullet is built here, not just a status clause bolted
          # onto a fixed sentence: a review found the old wording explained
          # the .dmg, Gatekeeper and the /Applications install path even when
          # no app was attached at all — nonsensical to read, since there was
          # nothing to open. The two cases now get two different bullets.
          if compgen -G 'release-artifacts/macos-*/*.dmg' > /dev/null; then
            MACOS_LINE="- **macOS** — the \`.dmg\` is not signed with a Developer ID and has not been"
            MACOS_LINE+=" notarised by Apple. Gatekeeper will refuse to open it on first launch;"
            MACOS_LINE+=" right-click the app and choose *Open*, or clear the quarantine attribute"
            MACOS_LINE+=" with \`xattr -dr com.apple.quarantine /Applications/MeedyaManager.app\`."
            MACOS_LINE+=" The macOS app **is** attached to this release."
          else
            MACOS_LINE="- **macOS** — **no app is attached to this release.** The SwiftUI app does"
            MACOS_LINE+=" not yet link the Rust engine (issue #66) and would show no real data;"
            MACOS_LINE+=" only the \`meedya\` command-line tool is shipped for macOS, and it needs"
            MACOS_LINE+=" no Gatekeeper workaround. See #222."
          fi

          {
            echo "## ⚠️ Unsigned alpha build — read before installing"
            echo ""
            echo "This build is **unsigned and un-notarised**. No code-signing secrets are"
            echo "configured for this repository, so:"
            echo ""
            echo "${MACOS_LINE}"
            echo "- **Windows** — the executables carry no Authenticode signature, so"
            echo "  SmartScreen will warn. The Windows jobs are also marked"
            echo "  \`continue-on-error\` (issue #148), so they may produce nothing at all."
            echo "  ${WIN_STATUS}"
            echo "- **Linux** — the \`.deb\` is unsigned; \`apt\` will install it with"
            echo "  \`dpkg -i\` but will not verify a repository signature."
            echo ""
            echo "**No AppImage is included.** \`linux/appimage/build-appimage.sh\` does not"
            echo "yet bundle GTK4/libadwaita, so the AppImage it produces is not"
            echo "self-contained and would fail on most hosts. It is deliberately omitted"
            echo "rather than shipped broken. Use the \`.deb\` or the \`.tar.gz\` on Linux."
            echo ""
            echo "Verify every download against \`MeedyaManager-${VERSION}-SHA256SUMS.txt\`."
            echo ""
            echo "---"
            echo ""
          } > /tmp/body.md

          if [ -f release-artifacts/release-notes/release-notes.md ]; then
            cat release-artifacts/release-notes/release-notes.md >> /tmp/body.md
          else
            echo "See [CHANGELOG](docs/changelog.md) for details." >> /tmp/body.md
          fi

          echo "--- release body ---"
          cat /tmp/body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Explicit tag_name so a `publish: true` manual run (which has no tag
          # ref) still targets the right tag.
          tag_name: "v${{ needs.prepare.outputs.version }}"
          name: "MeedyaManager v${{ needs.prepare.outputs.version }}"
          body_path: /tmp/body.md
          draft: true
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          # The Windows jobs may have failed (#148), so an unmatched *.zip glob
          # must not fail the release.
          fail_on_unmatched_files: false
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.dmg
            release-artifacts/**/*.deb
            release-artifacts/**/*.zip
            release-artifacts/**/*.sha256
            ${{ needs.prepare.outputs.artifact_prefix }}-SHA256SUMS.txt
