# MeedyaManager — Rust Core CI

name: Rust Core CI

on:
  # Direct pushes to main, alpha or beta still trigger native runs.
  push:
    branches: [main, alpha, beta]
    # Keep in sync with the `rust` detection regex in pr-gate.yml's `changes`
    # job (hard rule — see .claude/CLAUDE.md branch-protection section).
    # rust-toolchain.toml, deny.toml, clippy.toml and .cargo/ were previously
    # missing here even though pr-gate.yml's regex already covered them —
    # fixed as part of #204/#197 so a direct push touching only, say, the
    # toolchain pin actually triggers this workflow instead of silently
    # skipping it.
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "clippy.toml"
      - ".cargo/**"
  # PRs reach this workflow via pr-gate.yml (the umbrella). pr-gate decides
  # whether to call it based on changed paths; do NOT add a pull_request:
  # trigger here or runs will duplicate.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-ci:
    name: Rust (${{ matrix.rust }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # This label is cosmetic, not a second toolchain under test (#197).
        # The actual compiler version is pinned by rust-toolchain.toml
        # (channel = "1.98.0") at the repo root: rustup's toolchain-file
        # override takes precedence over whatever `dtolnay/rust-toolchain@stable`
        # sets as the rustup default below, so every job here really builds
        # with 1.98.0 regardless of this label. Renamed from "stable" so the
        # matrix doesn't imply a floating/second toolchain is being exercised.
        rust: [pinned]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # NOTE (#197): this installs and `rustup default`s the *actual* latest
      # "stable" release, but that default is overridden the moment cargo/
      # rustc runs inside this checkout, because rustup's directory-walk
      # toolchain-file override (rust-toolchain.toml) outranks `rustup
      # default` (verified against rustup's own src/config.rs
      # find_override_config resolution order). So leaving this action as
      # `@stable` — across all ~11 workflow usages — is correct and does NOT
      # defeat the pin; do not "fix" this by pinning the action itself.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy lints
        # mm-gtk requires GTK4 system libraries (only available in ci-linux.yml).
        # Exclude it here so the 3-OS matrix stays clean on macOS and Windows.
        # No `--exclude mm-gtk` needed: the root Cargo.toml carries
        # `exclude = ["crates/mm-gtk"]`, so the crate is not a workspace member
        # and `--workspace` never selects it.  Passing --exclude for a
        # non-member makes cargo emit
        #   warning: excluded package(s) `mm-gtk` not found in workspace
        # on every run, which is noise in the log for no benefit.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        # mm-gtk is exercised in ci-linux.yml where GTK4 is installed via apt.
        # See the note on the clippy step above — mm-gtk is excluded at the
        # workspace level, so --exclude here only produces a warning.
        run: cargo test --workspace

      - name: Build documentation with warnings-as-errors
        # Gate rustdoc builds: ensure no warnings remain. This catches broken
        # intra-doc links, malformed HTML tags, unresolved references, etc.
        # The build is skipped on macOS and Windows (mm-gtk GTK4 deps), but
        # a ubuntu-latest job is sufficient to catch rustdoc issues that are
        # platform-independent.
        if: runner.os == 'Linux'
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  # ---------------------------------------------------------------------------
  # Version Sync — verify all platform version files match Cargo.toml
  # ---------------------------------------------------------------------------
  version-check:
    name: Version Sync Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify version consistency across platforms
        run: |
          # Extract version from Cargo.toml [workspace.package]
          CARGO_VER=$(grep -A 20 '\[workspace\.package\]' Cargo.toml | grep '^version' | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "Cargo.toml version: $CARGO_VER"

          # Strip pre-release suffix for platform comparisons
          BASE_VER=$(echo "$CARGO_VER" | sed 's/-.*//')
          echo "Base version (no pre-release): $BASE_VER"

          # Check Windows MSIX manifest (expects X.Y.Z.0 format)
          # The <Identity> element spans multiple lines, so use sed to extract the Version attribute
          MSIX_VER=$(sed -n '/<Identity/,/\/>/{ s/.*Version="\([^"]*\)".*/\1/p; }' windows/MeedyaManager/Package.appxmanifest)
          EXPECTED_MSIX="${BASE_VER}.0"
          echo "MSIX version: $MSIX_VER (expected: $EXPECTED_MSIX)"
          if [ "$MSIX_VER" != "$EXPECTED_MSIX" ]; then
            echo "::error file=windows/MeedyaManager/Package.appxmanifest::MSIX version ($MSIX_VER) does not match Cargo.toml ($EXPECTED_MSIX)"
            FAILED=1
          fi

          # Check macOS Info.plist (expects X.Y.Z format)
          PLIST_VER=$(grep -A1 'CFBundleShortVersionString' macos/MeedyaManager/Info.plist | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>/\1/')
          echo "Info.plist version: $PLIST_VER (expected: $BASE_VER)"
          if [ "$PLIST_VER" != "$BASE_VER" ]; then
            echo "::error file=macos/MeedyaManager/Info.plist::Info.plist version ($PLIST_VER) does not match Cargo.toml ($BASE_VER)"
            FAILED=1
          fi

          # Check crates/mm-gtk/Cargo.toml. mm-gtk is `exclude`d from the
          # workspace (gettextrs needs Linux system libs), so it CANNOT use
          # `version.workspace = true` — its version is a hand-maintained
          # literal and had silently drifted to 1.3.0 (#197). Unlike the
          # plist/MSIX checks above, this compares the FULL version string
          # including any pre-release suffix (e.g. "1.4.0-alpha.1") — mm-gtk
          # is a dev/CI-only crate, not a versioned platform bundle with its
          # own numbering scheme, so there is no reason to strip it here.
          GTK_VER=$(grep '^version' crates/mm-gtk/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "mm-gtk Cargo.toml version: $GTK_VER (expected: $CARGO_VER)"
          if [ "$GTK_VER" != "$CARGO_VER" ]; then
            echo "::error file=crates/mm-gtk/Cargo.toml::mm-gtk version ($GTK_VER) does not match Cargo.toml ($CARGO_VER)"
            FAILED=1
          fi

          # Check linux/snap/snapcraft.yaml. Same rationale as mm-gtk above:
          # exact match against the full Cargo.toml semver, pre-release
          # suffix included — it had silently drifted to 0.9.0 (#197).
          SNAP_VER=$(grep '^version:' linux/snap/snapcraft.yaml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "snapcraft.yaml version: $SNAP_VER (expected: $CARGO_VER)"
          if [ "$SNAP_VER" != "$CARGO_VER" ]; then
            echo "::error file=linux/snap/snapcraft.yaml::snapcraft.yaml version ($SNAP_VER) does not match Cargo.toml ($CARGO_VER)"
            FAILED=1
          fi

          if [ -n "$FAILED" ]; then
            echo ""
            echo "Version files are out of sync!"
            echo "Run the version-bump workflow to fix: gh workflow run version-bump.yml -f version=$CARGO_VER"
            exit 1
          fi

          echo "All platform versions in sync with Cargo.toml ($CARGO_VER)"
