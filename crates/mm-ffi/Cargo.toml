# MeedyaManager — Foreign function interface crate
# Exposes core functionality to Swift (UniFFI) and C#/C (cbindgen extern "C").

[package]
name = "mm-ffi"
description = "FFI bindings for MeedyaManager (UniFFI for Swift, cbindgen for C#)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# cdylib: produces a shared library (.so/.dylib/.dll) consumed by Swift / C#
# lib:    allows other Rust crates to depend on this crate in tests
crate-type = ["cdylib", "lib"]

[dependencies]
# Internal crates — expose core business logic through the FFI boundary
mm-core = { path = "../mm-core" }

# UniFFI runtime — handles type conversion and scaffolding for Swift bindings.
# "cli" pulls in uniffi_bindgen/clap/camino (already resolved in Cargo.lock via
# cbindgen's own deps) and is what makes `src/bin/uniffi-bindgen.rs` buildable.
uniffi = { version = "0.31", features = ["tokio", "cli"] }

# Async runtime — required for UniFFI async callbacks
tokio = { version = "1", features = ["full"] }

# Serialization — JSON encoding for C API string returns
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Platform directories — used by config_path()
dirs = "6"

# File watcher types — used by ActiveWatcher handle
notify = "7"

[build-dependencies]
# UniFFI build support — generates scaffolding from UDL file at build time
uniffi = { version = "0.31", features = ["build"] }

# cbindgen — generates C headers from #[no_mangle] extern "C" functions.
# Pinned >=0.29: 0.27 only recognises the bare `#[no_mangle]` attribute, not
# the Rust-2024 `#[unsafe(no_mangle)]` form used throughout capi.rs, and so
# silently exported zero prototypes (issue #64).
cbindgen = "0.29"

[lints]
workspace = true
